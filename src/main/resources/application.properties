# Configurando a conex\u00e3o com MongoDB enquanto reposit\u00f3rio de dados
spring.data.mongodb.uri=${MONGODB_URI:mongodb://localhost:27017/pizzaria}
spring.data.mongodb.database=pizzaria
# Definindo usu\u00e1rio e senha padr\u00e3o para autentica\u00e7\u00e3o de usu\u00e1rio do sistema
#spring.main.allow-circular-references=true

spring.thymeleaf.prefix=classpath:/templates/
spring.thymeleaf.suffix=.html
spring.thymeleaf.mode=HTML
spring.thymeleaf.cache=false

logging.level.com.atrah=DEBUG

# Dashboard administrativo
# Fuso usado para definir "dia" e "hora" nos indicadores
pediupatrao.fuso-horario=America/Sao_Paulo
# Pedidos em RECEBIDO/EM PREPARACAO/PRONTO ha mais de N minutos sao considerados atrasados
pediupatrao.dashboard.limite-atraso-minutos=40
# Popula o banco com dados ficticios de demonstracao quando nao houver pedidos (somente ambiente local)
pediupatrao.demo-data=${PEDIUPATRAO_DEMO_DATA:false}
