<!DOCTYPE html><html lang="pt-br" xmlns:th="http://www.thymeleaf.org"><body><section th:fragment="content" class="content"><div class="container-fluid"><h1>Auditoria</h1><p>Registros somente para consulta. Não é permitido editar ou excluir eventos.</p><div class="card"><div class="card-body table-responsive"><table class="table table-striped"><thead><tr><th>Data/hora (UTC)</th><th>Usuário</th><th>Perfil</th><th>Operação</th><th>Entidade</th><th>ID</th><th>Alterações</th><th>Justificativa</th></tr></thead><tbody><tr th:each="e : ${eventos}"><td th:text="${e.dataHora}"></td><td th:text="${e.usuario}"></td><td th:text="${e.perfil}"></td><td th:text="${e.operacao}"></td><td th:text="${e.entidade}"></td><td th:text="${e.entidadeId}"></td><td><span th:text="${e.camposAlterados}"></span></td><td th:text="${e.justificativa}"></td></tr><tr th:if="${#lists.isEmpty(eventos)}"><td colspan="8">Nenhum evento registrado.</td></tr></tbody></table></div></div></div></section></body></html>
